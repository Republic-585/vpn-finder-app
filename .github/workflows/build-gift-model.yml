name: Build CAD gift model

on:
  push:
    paths:
      - "scripts/build_gift_model.py"
      - ".github/workflows/build-gift-model.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CAD toolchain
        run: python -m pip install --upgrade pip && python -m pip install cadquery trimesh numpy
      - name: Generate GLB from parametric CAD
        run: python scripts/build_gift_model.py
      - name: Commit generated model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models/VPN_Finder_Gift_Box.glb
          if git diff --cached --quiet; then
            echo "CAD model is already up to date"
          else
            git commit -m "Build CAD gift box model"
            git push origin HEAD:main
          fi

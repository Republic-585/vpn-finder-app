<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#202124">
<meta name="description" content="VPN Finder">
<title>VPN Finder</title>
<link rel="stylesheet" href="./assets/css/styles.css?v=20261121-compact3">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script defer src="./assets/js/app.js?v=20261121-catalogfix1"></script>
</head>
<body>
<div class="app-shell">
<main class="main-content">
  <section class="screen active" id="screen-catalog" data-screen="catalog">
    <label class="search-box">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m16 16 4 4"></path></svg>
      <input id="search" type="search" placeholder="Поиск" autocomplete="off">
      <button id="clear-search" class="clear-search" type="button" aria-label="Очистить поиск" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"></path></svg></button>
    </label>
    <div class="catalog-section-heading"><h2>Популярный выбор</h2><button id="toggle-catalog" type="button" aria-expanded="false">Посмотреть все</button></div>
    <div class="filter-strip" role="group" aria-label="Фильтры" hidden>
      <button class="filter-chip active" type="button" data-filter="all">Все</button>
      <button class="filter-chip" type="button" data-filter="free">Бесплатно</button>
    </div>
    <div class="provider-list" id="provider-list"><div class="loading-state"><span class="loader"></span></div></div>
  </section>

  <section class="screen" id="screen-compare" data-screen="compare">
    <div class="page-heading"><h1>Сравнение</h1></div>
    <div id="compare-list"></div>
  </section>

  <section class="screen" id="screen-favorites" data-screen="favorites">
    <div class="page-heading"><h1>Избранное</h1></div>
    <div id="favorites-list"></div>
  </section>

  <section class="screen" id="screen-profile" data-screen="profile">
    <div class="profile-view" aria-live="polite">
      <div class="profile-photo-wrap">
        <img class="profile-photo" id="profile-photo" alt="" hidden referrerpolicy="no-referrer">
        <div class="profile-avatar-fallback" id="profile-avatar-fallback">V</div>
      </div>
      <h1 class="profile-name" id="profile-name">Загрузка профиля…</h1>
      <a class="profile-page-link" id="profile-link" hidden target="_blank" rel="noopener noreferrer"></a>
      <span class="profile-page-empty" id="profile-no-link" hidden>Адрес страницы не указан</span>
    </div>
  </section>
</main>
<nav class="bottom-nav" aria-label="Навигация">
  <button class="nav-item active" type="button" data-go="catalog" aria-current="page">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8 20 6v5.2c0 5-3.2 8.2-8 10-4.8-1.8-8-5-8-10V6l8-3.2Z"></path><path d="m8.5 11.8 2.3 2.3 4.8-4.8"></path></svg><span>Finder</span>
  </button>
  <button class="nav-item" type="button" data-go="compare">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 19V5m-4 4 4-4 4 4M16.5 5v14m-4-4 4 4 4-4"></path></svg><span>Сравнить</span>
  </button>
  <button class="nav-item" type="button" data-go="favorites">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 8.8c0 5.1-8.8 11-8.8 11s-8.8-5.9-8.8-11A4.8 4.8 0 0 1 12 6.1a4.8 4.8 0 0 1 8.8 2.7Z"></path></svg><span>Избранное</span>
  </button>
  <button class="nav-item" type="button" data-go="profile">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.4"></circle><path d="M4.8 19.4c.7-3.1 3.1-4.8 7.2-4.8s6.5 1.7 7.2 4.8"></path></svg><span>Профиль</span>
  </button>
</nav>
</div>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17212B">
<meta name="description" content="VPN Finder">
<title>VPN Finder</title>
<link rel="stylesheet" href="./assets/css/styles.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script defer src="./assets/js/app.js"></script>
</head>
<body>
<div class="app-shell">
<header class="topbar">
  <a class="brand" href="#" aria-label="VPN Finder"><span class="brand-mark">V</span><span class="brand-name">VPN Finder</span></a>
  <button class="profile-shortcut" id="profile-shortcut" type="button" aria-label="Профиль"><span class="avatar" id="avatar-initial">V</span></button>
</header>
<main class="main-content">
  <section class="screen active" id="screen-catalog" data-screen="catalog">
    <div class="page-heading catalog-heading"><h1>Каталог</h1></div>
    <label class="search-box">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m16 16 4 4"></path></svg>
      <input id="search" type="search" placeholder="Поиск" autocomplete="off">
      <button id="clear-search" class="clear-search" type="button" aria-label="Очистить" hidden>×</button>
    </label>
    <div class="filter-strip" role="group" aria-label="Фильтры">
      <button class="filter-chip active" type="button" data-filter="all">Все</button>
      <button class="filter-chip" type="button" data-filter="trial">Пробный</button>
      <button class="filter-chip" type="button" data-filter="multi">2+ устройства</button>
      <button class="filter-chip" type="button" data-filter="whitelist">Белые списки</button>
    </div>
    <div class="catalog-toolbar"><span id="result-count"></span></div>
    <div class="provider-list" id="provider-list"><div class="loading-state"><span class="loader"></span></div></div>
  </section>

  <section class="screen" id="screen-compare" data-screen="compare">
    <div class="page-heading"><h1>Сравнение</h1></div>
    <div id="compare-list"></div>
  </section>

  <section class="screen" id="screen-favorites" data-screen="favorites">
    <div class="page-heading"><h1>Избранное</h1></div>
    <div id="favorites-list"></div>
  </section>

  <section class="screen" id="screen-profile" data-screen="profile">
    <div class="page-heading"><h1>Профиль</h1></div>
    <div class="profile-card">
      <div class="profile-avatar" id="profile-avatar">V</div>
      <div class="profile-identity"><strong id="profile-name">Пользователь</strong><span id="profile-status">Telegram</span></div>
    </div>
    <div class="settings-list">
      <div class="settings-row"><span>Платформа</span><strong id="platform-value">Telegram</strong></div>
      <div class="settings-row"><span>Избранное</span><strong id="favorites-count">0</strong></div>
      <div class="settings-row"><span>Сравнение</span><strong id="compare-count">0</strong></div>
    </div>
  </section>
</main>
<nav class="bottom-nav" aria-label="Навигация">
  <button class="nav-item active" type="button" data-go="catalog" aria-current="page">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1.5"></rect><rect x="14" y="4" width="6" height="6" rx="1.5"></rect><rect x="4" y="14" width="6" height="6" rx="1.5"></rect><rect x="14" y="14" width="6" height="6" rx="1.5"></rect></svg><span>Каталог</span>
  </button>
  <button class="nav-item" type="button" data-go="compare">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h3M16 4h3a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-3M8 12h8"></path><path d="m12 8 4 4-4 4"></path></svg><span>Сравнить</span>
  </button>
  <button class="nav-item" type="button" data-go="favorites">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 8.8c0 5.1-8.8 10.2-8.8 10.2S3.2 13.9 3.2 8.8A4.5 4.5 0 0 1 12 6.5a4.5 4.5 0 0 1 8.8 2.3Z"></path></svg><span>Избранное</span>
  </button>
  <button class="nav-item" type="button" data-go="profile">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 20c.8-3.2 3.2-5 7-5s6.2 1.8 7 5"></path></svg><span>Профиль</span>
  </button>
</nav>
</div>
</body>
</html>
